name: Apply automation framework fixes

on:
  push:
    branches:
      - fix/veyon-db-music-setup
    paths:
      - .github/workflows/apply-automation-framework-fixes.yml
      - .github/scripts/apply_automation_framework_fixes.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/veyon-db-music-setup
          fetch-depth: 0

      - name: Scope migration selector to manual result record
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/apply_automation_framework_fixes.py')
          s=p.read_text()
          old='''server = replace_once(\n    server,\n    "resultSummary:{action:event.action,actions:[event.action,...(event.actions||[]).map(x=>x.action)],targets:event.targets}",\n    "resultSummary:{action:event.action,actions:[event.action,...(event.actions||[]).map(x=>x.action)],targets:event.targets,failures:automationRunFailures(result)}",\n    "manual result failure details",\n)'''
          new='''server = replace_once(\n    server,\n    'event.lastRun={at:new Date().toISOString(),ok:result.ok!==false,manual:true,message:result.ok===false?"Completed with action errors":"Completed",resultSummary:{action:event.action,actions:[event.action,...(event.actions||[]).map(x=>x.action)],targets:event.targets}};',\n    'event.lastRun={at:new Date().toISOString(),ok:result.ok!==false,manual:true,message:result.ok===false?"Completed with action errors":"Completed",resultSummary:{action:event.action,actions:[event.action,...(event.actions||[]).map(x=>x.action)],targets:event.targets,failures:automationRunFailures(result)}};',\n    "manual result failure details",\n)'''
          if old not in s:
              raise SystemExit('manual migration selector block not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Apply framework fixes
        run: python3 .github/scripts/apply_automation_framework_fixes.py

      - name: Validate patched sources
        run: |
          node --check src/server.js
          node --check public/controller/app.js
          node --test test/automation-framework-manual.test.js

      - name: Commit fixes and remove one-time migration helpers
        run: |
          rm -f .github/workflows/apply-automation-framework-fixes.yml
          rm -f .github/scripts/apply_automation_framework_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden automation framework execution"
          git push origin HEAD:fix/veyon-db-music-setup
