name: Apply automation framework fixes

on:
  push:
    branches:
      - fix/veyon-db-music-setup
    paths:
      - .github/workflows/apply-automation-framework-fixes.yml
      - .github/scripts/apply_automation_framework_fixes.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/veyon-db-music-setup
          fetch-depth: 0

      - name: Apply framework fixes
        run: python3 .github/scripts/apply_automation_framework_fixes.py

      - name: Validate patched sources
        run: |
          node --check src/server.js
          node --check public/controller/app.js
          node --test test/automation-framework-manual.test.js

      - name: Commit fixes and remove one-time migration helpers
        run: |
          rm -f .github/workflows/apply-automation-framework-fixes.yml
          rm -f .github/scripts/apply_automation_framework_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden automation framework execution"
          git push origin HEAD:fix/veyon-db-music-setup
