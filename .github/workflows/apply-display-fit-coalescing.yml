name: Apply display fit coalescing

on:
  push:
    branches: [fix/display-text-sizing]
    paths:
      - '.github/scripts/apply_display_fit_coalescing.py'
      - '.github/workflows/apply-display-fit-coalescing.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/display-text-sizing
          fetch-depth: 0
      - name: Apply coalesced fitting
        run: python3 .github/scripts/apply_display_fit_coalescing.py
      - name: Validate
        run: |
          node --test test/display-text-sizing.test.js
          grep -q 'function scheduleFit()' public/display/index.html
      - name: Commit and remove one-time helpers
        run: |
          rm -f .github/scripts/apply_display_fit_coalescing.py .github/workflows/apply-display-fit-coalescing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/display/index.html test/display-text-sizing.test.js docs/DISPLAY-TEXT-SIZING.md .github/scripts/apply_display_fit_coalescing.py .github/workflows/apply-display-fit-coalescing.yml
          git commit -m 'fix: make display text fitting idempotent'
          git push origin HEAD:fix/display-text-sizing
