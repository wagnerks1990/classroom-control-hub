name: Apply Sendspin lifecycle hardening

on:
  push:
    branches:
      - fix/music-assistant-sendspin-lifecycle-final
    paths:
      - .github/workflows/apply-sendspin-lifecycle-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/music-assistant-sendspin-lifecycle-final
          fetch-depth: 0

      - name: Apply lifecycle patch
        run: |
          python3 scripts/apply-sendspin-lifecycle-fix.py

      - name: Verify lifecycle invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/display/index.html').read_text()
          required=[
            "maReconnectAttempts=0",
            "duplicateAttachIgnored:true",
            "scheduleMusicAssistantReconnect",
            "lastCloseCode:e.code",
            "autoFit:false",
            "autoFit:p.autoFit===true",
          ]
          for token in required:
            assert token in s, token
          assert "try{maSendspinPlayer.setVolume(desiredVolume);maSendspinPlayer.setMuted(desiredMuted)}catch{}" not in s
          print('Sendspin lifecycle invariants verified')
          PY

      - name: Add regression test and documentation
        run: |
          cat > test/music-assistant-sendspin-lifecycle.test.js <<'EOF'
          const fs=require('fs');
          const assert=require('assert');
          const html=fs.readFileSync('public/display/index.html','utf8');
          assert(html.includes('duplicateAttachIgnored:true'));
          assert(html.includes('scheduleMusicAssistantReconnect'));
          assert(html.includes('lastCloseCode:e.code'));
          assert(html.includes('applyMusicAssistantDesiredState'));
          assert(!html.includes('try{maSendspinPlayer.setVolume(desiredVolume);maSendspinPlayer.setMuted(desiredMuted)}catch{}'));
          console.log('Music Assistant Sendspin lifecycle regression checks passed');
          EOF
          node test/music-assistant-sendspin-lifecycle.test.js
          cat >> docs/AUTOMATION-FRAMEWORK.md <<'EOF'

          ## Music Assistant / Sendspin display lifecycle

          Classroom displays treat repeated Music Assistant attach commands for the same player as state updates rather than restart requests while the Sendspin proxy socket is connecting or open. Desired volume and mute state are applied only after Sendspin reports an active protocol state. Proxy disconnects expose close code/reason diagnostics and use bounded exponential reconnect backoff instead of a fixed reconnect loop.
          EOF

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-sendspin-lifecycle-fix.yml

      - name: Commit applied fix
        run: |
          git config user.name "Kyle Wagner"
          git config user.email "31423401+wagnerks1990@users.noreply.github.com"
          git add public/display/index.html scripts/apply-sendspin-lifecycle-fix.py test/music-assistant-sendspin-lifecycle.test.js docs/AUTOMATION-FRAMEWORK.md .github/workflows/apply-sendspin-lifecycle-fix.yml
          git commit -m "fix: stabilize Music Assistant Sendspin lifecycle"
          git push origin HEAD:fix/music-assistant-sendspin-lifecycle-final
