name: Apply Morning Announcements stability patch

on:
  push:
    branches:
      - fix/morning-announcement-stability-alpha72
    paths:
      - 'tools/apply-morning-stream-stability.py'
      - '.github/workflows/apply-morning-stream-stability-alpha72.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/morning-announcement-stability-alpha72
          fetch-depth: 0
      - name: Apply deterministic server/controller patch
        run: python3 tools/apply-morning-stream-stability.py
      - name: Validate patch
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          git diff --check
      - name: Commit generated changes
        run: |
          git config user.name 'classroom-hub-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add src/server.js public/controller/app.js public/controller/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Stabilize Morning Announcements monitoring lifecycle'
          git push origin HEAD:fix/morning-announcement-stability-alpha72
