name: Apply alpha.66 Failsafe Resync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-alpha66-failsafe.js'
      - '.github/workflows/apply-alpha66.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply alpha.66 patch
        run: node scripts/apply-alpha66-failsafe.js

      - name: Validate JavaScript
        run: |
          node --check src/server.js
          node --check maintenance-agent/server.js
          node tools/validate-controller.js

      - name: Validate Python
        run: python -m py_compile host-agent/server.py

      - name: Verify version convergence
        run: |
          test "$(cat VERSION)" = "1.0.0-alpha.66"
          grep -q "1.0.0-alpha.66" src/server.js
          grep -q "1.0.0-alpha.66" public/display/index.html
          grep -q "1.0.0-alpha.66" public/controller/index.html
          grep -q "1.0.0-alpha.66" maintenance-agent/server.js

      - name: Commit alpha.66
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION package.json CHANGELOG.md src/server.js public/display/index.html public/controller/index.html public/controller/display.html maintenance-agent/package.json maintenance-agent/server.js host-agent/server.py
          if git diff --cached --quiet; then
            echo 'No alpha.66 changes to commit.'
            exit 0
          fi
          git commit -m 'Release alpha.66 post-announcement failsafe resync'
          git push origin HEAD:main
