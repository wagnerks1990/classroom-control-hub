name: Apply idempotent display fit
on:
  push:
    branches: [fix/display-text-sizing]
    paths:
      - scripts/apply-idempotent-display-fit.py
      - .github/workflows/apply-idempotent-display-fit.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/display-text-sizing
      - name: Apply patch
        run: python3 scripts/apply-idempotent-display-fit.py
      - name: Verify renderer
        run: |
          grep -q 'function scheduleFit' public/display/index.html
          ! grep -q 'requestAnimationFrame(fitAllContent)' public/display/index.html
          grep -q 'new ResizeObserver(()=>scheduleFit())' public/display/index.html
      - name: Commit patched renderer and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/apply-idempotent-display-fit.py .github/workflows/apply-idempotent-display-fit.yml
          git add public/display/index.html scripts/apply-idempotent-display-fit.py .github/workflows/apply-idempotent-display-fit.yml
          git commit -m 'fix: make display text fitting idempotent'
          git push origin HEAD:fix/display-text-sizing
