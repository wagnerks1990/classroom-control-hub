name: Apply alpha.65 HLS Live Watch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-alpha65-hls-live-watch.py'
      - '.github/workflows/apply-alpha65.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply alpha.65 update
        run: python scripts/apply-alpha65-hls-live-watch.py

      - name: Validate alpha.65 source
        run: |
          node --check src/server.js
          node --check maintenance-agent/server.js
          node tools/validate-controller.js
          python -m py_compile host-agent/server.py
          test "$(cat VERSION)" = "1.0.0-alpha.65"
          if grep -R "1.0.0-alpha.64" VERSION package.json src public maintenance-agent host-agent --exclude-dir=node_modules --exclude='*.pyc'; then
            echo 'Version convergence failed'
            exit 1
          fi

      - name: Commit alpha.65 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION CHANGELOG.md README.md package.json src/server.js public/controller/index.html public/controller/display.html public/display/index.html maintenance-agent/package.json maintenance-agent/server.js host-agent/server.py
          if git diff --cached --quiet; then
            echo 'No alpha.65 changes to commit.'
            exit 0
          fi
          git commit -m 'Release alpha.65 HLS live-watch detection fix'
          git push origin HEAD:main
