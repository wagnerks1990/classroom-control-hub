name: Apply authoritative display font sizing

on:
  push:
    branches: [fix/display-text-sizing]
    paths:
      - '.github/workflows/apply-authoritative-display-fonts.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/display-text-sizing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Make configured display font sizes authoritative
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/display/index.html')
          s = p.read_text()
          replacements = {
            "let textOptions={size:64,autoFit:true},titleOptions={size:92,autoFit:true},subtitleOptions={size:44,autoFit:true};":
            "let textOptions={size:64,autoFit:false},titleOptions={size:92,autoFit:false},subtitleOptions={size:44,autoFit:false};",
            "textOptions={...textOptions,...p,size:Number(p.size??textOptions.size??64),autoFit:p.autoFit!==false};":
            "textOptions={...textOptions,...p,size:Number(p.size??textOptions.size??64),autoFit:p.autoFit===true};",
            "titleOptions={...titleOptions,...p,size:Number(p.size??titleOptions.size??92),autoFit:p.autoFit!==false};":
            "titleOptions={...titleOptions,...p,size:Number(p.size??titleOptions.size??92),autoFit:p.autoFit===true};",
            "subtitleOptions={...subtitleOptions,...p,size:Number(p.size??subtitleOptions.size??44),autoFit:p.autoFit!==false};":
            "subtitleOptions={...subtitleOptions,...p,size:Number(p.size??subtitleOptions.size??44),autoFit:p.autoFit===true};",
          }
          for old, new in replacements.items():
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match for {old[:60]!r}, found {count}')
            s = s.replace(old, new)
          p.write_text(s)

          # Guard against regressions: normal display commands must not opt in
          # to auto-fit merely because autoFit is omitted from the payload.
          t = Path('test/display-font-authority.test.js')
          t.write_text("""const fs=require('fs');\nconst assert=require('assert');\nconst html=fs.readFileSync('public/display/index.html','utf8');\nassert(html.includes('textOptions={size:64,autoFit:false}'));\nassert(html.includes('autoFit:p.autoFit===true'));\nassert(!html.includes('autoFit:p.autoFit!==false'));\nconsole.log('display configured font sizes are authoritative');\n""")

          # Keep operator/AI documentation aligned with renderer behavior.
          doc = Path('docs/AUTOMATION-FRAMEWORK.md')
          if doc.exists():
            text = doc.read_text()
            marker = '## Display font sizing\n'
            section = """\n## Display font sizing\n\nDisplay text, title, and subtitle actions treat the configured `size` as authoritative. The browser does not automatically shrink these elements unless the action payload explicitly sets `autoFit: true`. This guarantees that repeated manual or scheduled execution of an unchanged automation renders at the same font size on the same display.\n"""
            if marker in text:
              before = text.split(marker)[0].rstrip()
              # remove any old display font section at the end if present
              text = before + section
            else:
              text = text.rstrip() + section
            doc.write_text(text)
          PY
          node test/display-font-authority.test.js
          rm .github/workflows/apply-authoritative-display-fonts.yml
      - name: Commit fix
        run: |
          git config user.name "Kyle Wagner"
          git config user.email "31423401+wagnerks1990@users.noreply.github.com"
          git add public/display/index.html test/display-font-authority.test.js docs/AUTOMATION-FRAMEWORK.md .github/workflows/apply-authoritative-display-fonts.yml
          git commit -m "fix: make display font sizes authoritative"
          git push origin HEAD:fix/display-text-sizing
