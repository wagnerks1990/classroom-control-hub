name: Reconcile display and host-network changes
on:
  push:
    branches: [fix/host-networking]
    paths: [.github/workflows/reconcile-host-network.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.ref == 'refs/heads/fix/host-networking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/host-networking
          fetch-depth: 0
      - name: Merge the reviewed display revision and preserve both documentation additions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = 554abe78573fb42c8792df0b7184cc56457e5031
          if ! git merge --no-commit --no-ff origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            for file in "${conflicts[@]}"; do
              case "$file" in CHANGELOG.md|docs/AI-CONTEXT.md) ;; *) echo "Unreviewed conflict: $file" >&2; exit 1;; esac
              git show ":1:$file" > /tmp/base-doc
              git show ":2:$file" > /tmp/ours-doc
              git show ":3:$file" > /tmp/theirs-doc
              git merge-file --union /tmp/ours-doc /tmp/base-doc /tmp/theirs-doc
              cp /tmp/ours-doc "$file"
              git add "$file"
            done
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          test -f public/display/layout.mjs
          test -f public/display/security.mjs
          test -f tools/prepare-display-fonts.sh
          grep -q 'network_mode: host' docker-compose.yml
          grep -q 'Maintenance mutation boundary' docs/AI-CONTEXT.md
          grep -q 'Display merge review boundaries' docs/AI-CONTEXT.md
          node --check maintenance-agent/server.js
          git commit -m 'merge: preserve display-layout and security fixes alongside host networking'
          git push origin HEAD:refs/heads/fix/host-networking
