name: Publish Main Images

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: read
  packages: write

concurrency:
  group: publish-main-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for every required validation workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          required=('Validate' 'Display browser regression' 'Android TV Display Agent' 'Restrictive image permissions' 'Security gates')
          for attempt in $(seq 1 60); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${VALIDATED_SHA}&event=push&per_page=100")"
            missing=()
            for name in "${required[@]}"; do
              state="$(jq -r --arg name "$name" '[.workflow_runs[] | select(.name==$name)] | sort_by(.created_at) | last | if . == null then "missing" elif .conclusion != null then .conclusion else .status end' <<<"$runs")"
              case "$state" in
                success) ;;
                failure|cancelled|timed_out|action_required|stale|skipped)
                  echo "Required validation workflow failed: ${name}=${state}" >&2
                  exit 1
                  ;;
                *) missing+=("$name");;
              esac
            done
            if (( ${#missing[@]} == 0 )); then
              echo "All required validation workflows passed for ${VALIDATED_SHA}."
              break
            fi
            if (( attempt == 60 )); then
              printf 'Required workflows did not all pass: %s\n' "${missing[*]}" >&2
              exit 1
            fi
            printf 'Waiting for required workflows: %s\n' "${missing[*]}"
            sleep 30
          done

  build:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hub
            image: ghcr.io/wagnerks1990/roomgoblin
            legacy_image: ghcr.io/wagnerks1990/classroom-control-hub
            dockerfile: Dockerfile
          - name: maintenance
            image: ghcr.io/wagnerks1990/roomgoblin-maintenance
            legacy_image: ghcr.io/wagnerks1990/classroom-control-hub-maintenance
            dockerfile: maintenance-agent/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish validated image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ matrix.legacy_image }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          sbom: true
          provenance: mode=max

  promote:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: publish-main-alpha-promotion
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the validated image pair
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_main_sha" != "$VALIDATED_SHA" ]]; then
            echo "Skipping stale alpha promotion for ${VALIDATED_SHA}; main is ${current_main_sha}."
            exit 0
          fi
          for image in roomgoblin roomgoblin-maintenance classroom-control-hub classroom-control-hub-maintenance; do
            docker buildx imagetools create \
              --tag "ghcr.io/wagnerks1990/${image}:alpha" \
              "ghcr.io/wagnerks1990/${image}:sha-${VALIDATED_SHA}"
          done
