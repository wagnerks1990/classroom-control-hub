name: Apply display text sizing fix

on:
  push:
    branches: [fix/display-text-sizing]
    paths:
      - .github/scripts/apply_display_text_sizing_fix.py
      - .github/workflows/apply-display-text-sizing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/display-text-sizing
          fetch-depth: 0

      - name: Apply display text sizing fix
        run: python3 .github/scripts/apply_display_text_sizing_fix.py

      - name: Validate patched sources
        run: |
          node --test test/display-text-sizing.test.js
          node --check public/controller/app.js

      - name: Commit fix and remove one-time helpers
        run: |
          rm -f .github/scripts/apply_display_text_sizing_fix.py .github/workflows/apply-display-text-sizing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize classroom display text sizing"
          git push origin HEAD:fix/display-text-sizing
