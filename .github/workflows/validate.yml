name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Verify canonical source tree
        run: |
          test -f src/server.js
          test -f src/storage.js
          test -f maintenance-agent/server.js
          test -f public/controller/index.html
          test -f public/display/index.html
          test -f AGENTS.md
          test -f docs/AI-CONTEXT.md
          test ! -e Caddyfile
          test ! -e source-archive

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate main application syntax
        run: |
          node --check src/server.js
          node --check src/storage.js
          node --check src/school-schedule.js
          node --check src/security.js

      - name: Install locked maintenance dependencies
        working-directory: maintenance-agent
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit maintenance production dependencies
        working-directory: maintenance-agent
        run: npm audit --omit=dev --audit-level=high

      - name: Validate maintenance syntax
        run: |
          node --check maintenance-agent/server.js

      - name: Validate controller JavaScript
        run: node tools/validate-controller.js

      - name: Run stabilization regression tests
        run: npm test

      - name: Validate host agent Python
        run: python -m py_compile host-agent/server.py

      - name: Validate installer shell syntax
        run: |
          bash -n install.sh
          bash -n deploy/bootstrap.sh
          bash -n host-agent/app-update-runner.sh

      - name: Validate Compose configuration
        run: docker compose config >/dev/null

      - name: Build main container
        run: docker build -t classroom-control-hub:test .

      - name: Build maintenance container
        run: docker build -t classroom-control-hub-maintenance:test maintenance-agent

      - name: Compose direct HTTP smoke test
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^MAINTENANCE_TOKEN=.*/MAINTENANCE_TOKEN=ci-maintenance-token/' .env
          sed -i 's/^SETUP_TOKEN=.*/SETUP_TOKEN=ci-setup-token/' .env
          mkdir -p data/backups
          sudo chown -R 10001:10001 data
          sudo chown root:10001 data data/backups
          sudo chmod 0770 data
          sudo chmod 0700 data/backups
          sudo install -d -m 0750 -o root -g 10001 /etc/classroom-control-hub/veyon
          openssl rand -hex 32 | sudo tee /etc/classroom-control-hub/master.key >/dev/null
          sudo chown root:10001 /etc/classroom-control-hub/master.key
          sudo chmod 0640 /etc/classroom-control-hub/master.key
          sudo install -m 0640 -o root -g 10001 /dev/null /etc/classroom-control-hub/veyon/private.pem
          trap 'docker compose logs --no-color || true; docker compose down -v || true' EXIT
          docker compose build classroom-hub
          docker compose up -d --no-deps classroom-hub
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/health >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/health | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{const j=JSON.parse(s);if(!j.ok)process.exit(1)})'
          cookie_jar="$RUNNER_TEMP/classroom-hub.cookies"
          curl -fsS -c "$cookie_jar" -H 'X-Setup-Token: ci-setup-token' -H 'Content-Type: application/json' \
            --data '{"username":"ci-admin","displayName":"CI Administrator","password":"CI-Live-Test-Password-Alpha69!"}' \
            http://127.0.0.1:3000/api/v1/setup/administrator >/dev/null
          curl -fsS -b "$cookie_jar" -H 'Content-Type: application/json' -X PUT \
            --data '{"completed":true}' http://127.0.0.1:3000/api/v1/admin/setup-state >/dev/null
          docker compose restart classroom-hub
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/health >/dev/null && break; sleep 1; done
          curl -fsS -b "$cookie_jar" http://127.0.0.1:3000/api/v1/admin/health \
            | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{const j=JSON.parse(s);if(!j.ok||j.database.normalized.users!==1)process.exit(1)})'

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Parse Windows lab-agent scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem public/lab-agent/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { throw 'Windows lab-agent PowerShell parsing failed.' }
      - name: Verify Windows agent contract
        shell: pwsh
        run: |
          $agent = Get-Content public/lab-agent/ClassroomHubAgent.ps1 -Raw
          if ($agent -notmatch "1\.0\.0-alpha\.70") { throw 'Windows agent version is not converged.' }
          foreach ($action in @('screenshot','refresh-history','instructor-lock','update-agent')) {
            if ($agent -notmatch "'$([regex]::Escape($action))'\s*\{") { throw "Missing Windows action: $action" }
          }
