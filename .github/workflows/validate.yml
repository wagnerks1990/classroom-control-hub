name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Detect migration state
        id: source
        shell: bash
        run: |
          if [[ -f src/server.js && -f src/storage.js && -f maintenance-agent/server.js && -f maintenance-agent/storage.js && -f public/controller/index.html && -f public/display/index.html ]]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
            echo 'Direct application source tree is complete.'
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            echo 'Source migration is still in progress. Validation will perform repository-level checks only.'
            find src maintenance-agent public/controller public/display -maxdepth 2 -type f 2>/dev/null | sort || true
          fi

      - name: Install dependencies
        if: steps.source.outputs.complete == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate main server syntax
        if: steps.source.outputs.complete == 'true'
        run: node --check src/server.js

      - name: Validate storage syntax
        if: steps.source.outputs.complete == 'true'
        run: node --check src/storage.js

      - name: Install maintenance dependencies
        if: steps.source.outputs.complete == 'true'
        working-directory: maintenance-agent
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate maintenance syntax
        if: steps.source.outputs.complete == 'true'
        run: |
          node --check maintenance-agent/server.js
          node --check maintenance-agent/storage.js

      - name: Validate controller JavaScript
        if: steps.source.outputs.complete == 'true'
        run: node tools/validate-controller.js

      - name: Validate host agent Python
        run: python -m py_compile host-agent/server.py

      - name: Validate Compose configuration
        run: docker compose config >/dev/null

      - name: Build main container
        if: steps.source.outputs.complete == 'true'
        run: docker build -t classroom-control-hub:test .

      - name: Build maintenance container
        if: steps.source.outputs.complete == 'true'
        run: docker build -t classroom-control-hub-maintenance:test maintenance-agent

      - name: Migration status
        if: steps.source.outputs.complete != 'true'
        run: |
          echo '::notice::Application source migration is intentionally incomplete; full syntax and container builds will activate automatically once all direct source files are present.'
