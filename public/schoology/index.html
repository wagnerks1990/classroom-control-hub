<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classroom TV Control</title>
<style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:white;border:1px solid #d7dde3;border-radius:12px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tv{padding:9px;border:1px solid #c9d0d7;border-radius:8px;background:#fafbfc}button,textarea{font:inherit}button{padding:9px 12px;border:1px solid #bcc5cd;border-radius:8px;background:white}button.primary{background:#1769e0;color:white;border-color:#1769e0}textarea{width:100%;min-height:90px;box-sizing:border-box}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><div class="wrap"><div class="card"><h2>Classroom TV Control</h2><div id="status">Connecting…</div></div><div class="card"><div id="tvs" class="grid"></div></div><div class="card"><textarea id="msg">Classroom message</textarea><p><button class="primary" onclick="sendText()">Send</button> <button onclick="blank()">Blank</button></p></div></div>
<script type="module">import{api}from'/shared/common.js';let devices={},selected=new Set(['tv1']);async function init(){const j=await api('/api/v1/devices');devices=j.devices||{};const w=document.getElementById('tvs');for(const[id,d]of Object.entries(devices)){const l=document.createElement('label');l.className='tv';const c=document.createElement('input');c.type='checkbox';c.checked=selected.has(id);c.onchange=()=>c.checked?selected.add(id):selected.delete(id);l.append(c,document.createTextNode(' '+d.name));w.appendChild(l)}document.getElementById('status').textContent='Connected'}async function command(type,payload){const a=[...selected];await api('/api/v1/commands',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,target:a.length===1?a[0]:a,payload})})}window.sendText=()=>command('display.text',{text:document.getElementById('msg').value,color:'#fff',size:64,position:'center'});window.blank=()=>command('display.clear',{});init();</script></body></html>
