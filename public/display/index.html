<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom Display</title>
<link rel="stylesheet" href="/shared/attribution.css">
<script src="/shared/attribution.js" defer></script>
<style>
:root{--logical-width:1920px;--logical-height:1080px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#000;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;width:var(--logical-width);height:var(--logical-height);left:50%;top:50%;transform-origin:center center;background:#101318;color:#fff;overflow:hidden}
#media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:1}
#media img,#media video,#media iframe{width:100%;height:100%;border:0}
#titleRegion{position:absolute;left:72px;right:72px;top:30px;height:125px;text-align:center;z-index:7;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
#subtitleRegion{position:absolute;left:72px;right:72px;top:155px;height:100px;text-align:center;z-index:7;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
#title,#subtitle{max-width:100%;max-height:100%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.05}
#textLayer{position:absolute;left:90px;right:90px;top:270px;bottom:105px;display:flex;align-items:center;justify-content:center;z-index:5;pointer-events:none;overflow:hidden}
#text{max-width:100%;max-height:100%;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;line-height:1.1;text-align:center;text-shadow:0 2px 10px #0009;padding:.18em .3em;border-radius:.18em}
#presentationBlack{display:none;position:absolute;inset:0;background:#000;z-index:40}
#timerOverlay{display:none;position:absolute;left:50%;bottom:35px;transform:translateX(-50%);z-index:10000;pointer-events:none;min-width:240px;max-width:1760px;max-height:300px;padding:.18em .55em;border:4px solid #fff;border-radius:18px;color:#fff;background:rgba(0,0,0,.35);font-weight:800;font-variant-numeric:tabular-nums;font-size:64px;line-height:1;text-align:center;text-shadow:0 2px 10px #0009;box-shadow:0 4px 24px rgba(0,0,0,.28);overflow:hidden}
#timerOverlay.timer-top{top:35px;bottom:auto}
#timerOverlay.timer-center{top:50%;bottom:auto;transform:translate(-50%,-50%)}
#timerOverlay.timer-bottom{bottom:35px;top:auto}
#timerLabel{display:block;font-size:.28em;line-height:1.1;margin-bottom:.25em;font-weight:650;white-space:normal;overflow-wrap:anywhere}
#timerValue{display:block;letter-spacing:.03em;white-space:nowrap}
#identify{display:none;position:absolute;inset:0;z-index:50;background:#1769e0;color:#fff;align-items:center;justify-content:center;font-size:270px;font-weight:900;overflow:hidden}
#badge{position:fixed;right:8px;bottom:8px;background:#0009;color:#fff;font-size:11px;padding:5px 7px;border-radius:6px;opacity:.35;z-index:60}
</style>
</head>
<body>
<div id="stage"><div id="media"></div>
<div id="titleRegion"><div id="title"></div></div>
<div id="subtitleRegion"><div id="subtitle"></div></div>
<div id="textLayer"><div id="text"></div></div>
<div id="timerOverlay" class="timer-bottom"><span id="timerLabel"></span><span id="timerValue">00:00</span></div>
<div id="presentationBlack"></div>
<div id="identify"></div>
<div id="badge">Starting…</div></div>
<script type="module">
import {wsUrl,getDisplayId} from '/shared/common.js';
import {SendspinPlayer} from '/display/sendspin.bundle.js';
const LOGICAL_WIDTH=1920,LOGICAL_HEIGHT=1080,MIN_FONT=12,DISPLAY_BUILD='1.0.0-alpha.66';
const id=getDisplayId(),preview=new URLSearchParams(location.search).get('preview')==='1';
const displayToken=(()=>{try{const p=new URLSearchParams(location.hash.slice(1)),incoming=p.get('displayToken');if(incoming){localStorage.setItem('classroom-hub-display-token',incoming);history.replaceState(null,'',location.pathname+location.search)}return localStorage.getItem('classroom-hub-display-token')||''}catch{return ''}})();
const stage=document.getElementById('stage'),media=document.getElementById('media'),titleRegion=document.getElementById('titleRegion'),subtitleRegion=document.getElementById('subtitleRegion'),textLayer=document.getElementById('textLayer'),text=document.getElementById('text'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),presentationBlack=document.getElementById('presentationBlack'),identify=document.getElementById('identify'),badge=document.getElementById('badge'),timerOverlay=document.getElementById('timerOverlay'),timerLabel=document.getElementById('timerLabel'),timerValue=document.getElementById('timerValue');
let ws,timerState={visible:false,running:false,mode:'countdown',durationSeconds:300,remainingSeconds:300},timerTick=null,lastViewportSignature='';
let textOptions={size:64,autoFit:true},titleOptions={size:92,autoFit:true},subtitleOptions={size:44,autoFit:true};

function displayMetrics(){
  const vv=window.visualViewport;
  const viewportWidth=Math.max(1,Number(vv?.width||window.innerWidth||document.documentElement.clientWidth||LOGICAL_WIDTH));
  const viewportHeight=Math.max(1,Number(vv?.height||window.innerHeight||document.documentElement.clientHeight||LOGICAL_HEIGHT));
  const dpr=Math.max(.25,Number(window.devicePixelRatio||1));

    resolution:`${screen.width}x${screen.height}`,
    screenWidth:Number(screen.width||0),screenHeight:Number(screen.height||0),
    viewport:`${Math.round(viewportWidth)}x${Math.round(viewportHeight)}`,
    viewportWidth,viewportHeight,dpr,
    outer:`${window.outerWidth||0}x${window.outerHeight||0}`,
    fullscreen:!!document.fullscreenElement,
    build:DISPLAY_BUILD

}
function scaleStage(){
  const m=displayMetrics();

  // physical screen resolution are diagnostics only; multiplying by DPR here
  // would double-scale operating-system/browser HiDPI configurations.
  const scale=Math.min(m.viewportWidth/LOGICAL_WIDTH,m.viewportHeight/LOGICAL_HEIGHT);
  stage.style.transform=`translate(-50%,-50%) scale(${scale})`;
  stage.dataset.scale=String(scale);
  stage.dataset.viewport=m.viewport;
  stage.dataset.dpr=String(m.dpr);

}
function sendDisplayMetrics(){

function elementFits(el,box){

function fitText(el,box,maxSize,minSize=MIN_FONT){
  if(!el||!box||!el.textContent){return}

  let low=minSize,high=maxSize,best=minSize;
  el.style.fontSize=`${maxSize}px`;
  if(elementFits(el,box)){return}

    const mid=Math.floor((low+high)/2);

function reserveTextForTimer(){
  let bottom=105;

    bottom=Math.max(bottom,35+timerOverlay.offsetHeight+35);
  }
  textLayer.style.bottom=`${Math.min(430,bottom)}px`;
}
function fitAllContent(){
  reserveTextForTimer();
  if(titleOptions.autoFit!==false)fitText(title,titleRegion,titleOptions.size||92);else title.style.fontSize=`${Math.max(MIN_FONT,Number(titleOptions.size||92))}px`;
  if(subtitleOptions.autoFit!==false)fitText(subtitle,subtitleRegion,subtitleOptions.size||44);else subtitle.style.fontSize=`${Math.max(MIN_FONT,Number(subtitleOptions.size||44))}px`;
  if(textOptions.autoFit!==false)fitText(text,textLayer,textOptions.size||64);else text.style.fontSize=`${Math.max(MIN_FONT,Number(textOptions.size||64))}px`;
  if(timerState.visible){
    const max=timerState.fontSize??64;
    fitText(timerValue,timerOverlay,max,20);
  }
}
function applyTextOptions(p={}){
  textOptions={...textOptions,...p,size:Number(p.size??textOptions.size??64),autoFit:p.autoFit!==false};
  text.style.color=p.color||text.style.color||'#fff';
  if(p.background!==undefined)text.style.background=p.background||'transparent';
  if(p.position)textLayer.style.alignItems=p.position==='top'?'flex-start':p.position==='bottom'?'flex-end':'center';
  requestAnimationFrame(fitAllContent);
}
function applyTitle(p={}){
  titleOptions={...titleOptions,...p,size:Number(p.size??titleOptions.size??92),autoFit:p.autoFit!==false};
  title.textContent=p.text??title.textContent??'';title.style.color=p.color||'#fff';requestAnimationFrame(fitAllContent);
}
function applySubtitle(p={}){
  subtitleOptions={...subtitleOptions,...p,size:Number(p.size??subtitleOptions.size??44),autoFit:p.autoFit!==false};
  subtitle.textContent=p.text??subtitle.textContent??'';subtitle.style.color=p.color||'#fff';requestAnimationFrame(fitAllContent);
}
function formatTimerSeconds(total){total=Math.max(0,Math.floor(Number(total)||0));const h=Math.floor(total/3600),m=Math.floor((total%3600)/60),sec=total%60;return h>0?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function timerSecondsNow(){const now=Date.now();if(timerState.mode==='countup'){if(timerState.running&&timerState.startedAt)return Number(timerState.elapsedSeconds||0)+Math.max(0,(now-Number(timerState.startedAt))/1000);return Number(timerState.elapsedSeconds||0)}if(timerState.running&&timerState.endAt)return Math.max(0,(Number(timerState.endAt)-now)/1000);return Math.max(0,Number(timerState.remainingSeconds??timerState.durationSeconds??0))}
function paintTimer(){
  if(!timerState.visible){timerOverlay.style.display='none';requestAnimationFrame(fitAllContent);return}
  timerOverlay.style.display='block';timerLabel.textContent=timerState.label||'';timerLabel.style.display=timerState.label?'block':'none';timerValue.textContent=formatTimerSeconds(timerSecondsNow());

  timerOverlay.classList.remove('timer-top','timer-center','timer-bottom');timerOverlay.classList.add(`timer-${['top','center','bottom'].includes(timerState.position)?timerState.position:'bottom'}`);

}
function applyTimer(p={}){
  const incomingInstance=p.timerInstanceId||null;
  const currentInstance=timerState.timerInstanceId||null;

  if(timerTick){clearInterval(timerTick);timerTick=null}
  if(freshInstance){
    // A Run Now/Test Now/scheduled execution is a new countdown even when the
    // class end timestamp and all styling are identical to the previous timer.
    timerState={visible:false,running:false,mode:'countdown',durationSeconds:0,remainingSeconds:0,startedAt:null,endAt:null,...p};
  }else{
    timerState={...timerState,...p};
  }
  if(timerState.mode==='countdown'&&timerState.endAt&&Number(timerState.endAt)<=Date.now()){timerState.running=false;timerState.remainingSeconds=0;timerState.endAt=null}

function applyState(s){
  if(!s)return;if(s.background?.color)stage.style.background=s.background.color;
  if(s.text!==undefined)text.textContent=s.text;if(s.textOptions)applyTextOptions(s.textOptions);

let activeWebFrame=null,activeWebSpec=null,webAudioTimers=[];
function clearWebAudioTimers(){for(const t of webAudioTimers)clearTimeout(t);webAudioTimers=[]}
function isAntMediaPlayerUrl(value){
  try{const u=new URL(String(value||''),location.href);return u.pathname.endsWith('/play.html')}catch{return false}

  const u=new URL(String(value||''),location.href);
  u.searchParams.set('autoplay','true');
  u.searchParams.set('mute','false');
  if(!u.searchParams.get('playOrder'))u.searchParams.set('playOrder','webrtc,hls');
  if(cacheBust)u.searchParams.set('_chAudioRetry',String(Date.now()));
  return u.toString();

function integratedAntMediaUrl(value,volume=1,{cacheBust=false}={}){

  u.searchParams.set('volume',String(Math.max(0,Math.min(1,Number(volume??1)))));
  u.searchParams.set('autoplay','true');
  if(cacheBust)u.searchParams.set('_chAudioRetry',String(Date.now()));
  return u.toString();
}
function tryDirectWebAudio(frame,volume=1){
  try{
    const doc=frame?.contentDocument||frame?.contentWindow?.document;
    if(!doc)return false;
    let touched=false;
    const btn=doc.querySelector('#unmuteButton');
    if(btn){try{btn.click();touched=true}catch{}}
    for(const v of doc.querySelectorAll('video,audio')){
      try{v.muted=volume<=0;v.defaultMuted=volume<=0;v.volume=Math.max(0,Math.min(1,Number(volume??1)));v.autoplay=true;const play=v.play();if(play?.catch)play.catch(()=>{});touched=true}catch{}
    }

  }catch{return false}
}
function sendWebAudioHints(frame,volume=1){
  if(!frame?.contentWindow)return;
  const hints=[
    {type:'unmute'},
    {action:'unmute'},
    {type:'setMuted',muted:volume<=0},
    {type:'setVolume',volume:Math.max(0,Math.min(1,Number(volume??1)))},

function enforceWebAudio({reload=false,volume=null,unmute=true}={}){

    try{

function renderMedia(m){
  clearWebAudioTimers();activeWebFrame=null;activeWebSpec=null;media.innerHTML='';if(!m||!m.url)return;let n;
  if(m.type==='image'){
    n=document.createElement('img');n.decoding='async';n.src=m.url;let retries=0;n.onerror=()=>{if(retries>=3)return;retries++;const join=m.url.includes('?')?'&':'?';setTimeout(()=>{n.src=m.url+join+'retry='+Date.now()},500*retries)}
  }else if(m.type==='video'){
    n=document.createElement('video');n.src=m.url;n.autoplay=m.autoplay!==false;n.muted=!!m.muted;n.defaultMuted=!!m.muted;n.volume=Math.max(0,Math.min(1,Number(m.volume??1)));n.loop=!!m.loop;n.playsInline=true;n.oncanplay=()=>{if(m.forceAudio){n.muted=false;n.defaultMuted=false;n.volume=Math.max(.01,Number(m.volume??1))}n.play().catch(()=>{})};n.onended=()=>{if(!n.loop&&ws&&ws.readyState===1){try{ws.send(JSON.stringify({type:'display.media.ended',mediaType:'video'}))}catch{}}}

    const spec={...m,url:m.url,integratedAntMedia};
    n.src=integratedAntMedia?integratedAntMediaUrl(m.url,m.volume??1):m.url;
    if(isWeb){
      n.allow='autoplay; fullscreen; picture-in-picture';n.setAttribute('allowfullscreen','');n.setAttribute('webkitallowfullscreen','');

}

let maSendspinPlayer=null,maSendspinState={state:'detached'},maAttachGeneration=0,maProxySocket=null;
function maFriendlyName(){return id==='tv5'?'Classroom Control Hub - Hallway Display':`Classroom Control Hub - ${id.toUpperCase()}`}

function detachMusicAssistant(){maAttachGeneration++;if(maSendspinPlayer){try{maSendspinPlayer.disconnect('user_request')}catch{};maSendspinPlayer=null}if(maProxySocket){try{maProxySocket.close()}catch{};maProxySocket=null}reportMusicAssistantStatus({state:'detached',isPlaying:false,protocolActive:false,audioLocked:false,error:null,proxyState:'closed'})}

function handle(c){const p=c.payload||{};switch(c.type){

  case'display.background':stage.style.background=p.color||'#101318';break;
  case'display.image':renderMedia({type:'image',...p});break;case'display.video':renderMedia({type:'video',...p});break;case'display.web':renderMedia({type:'web',...p});break;case'display.web.audio':enforceWebAudio({reload:!!p.reload,volume:p.volume,unmute:p.unmute!==false});break;case'display.pdf':case'display.document':renderMedia({type:'pdf',...p});break;case'display.presentation':renderMedia({type:'image',...p});presentationBlack.style.display='none';break;case'display.presentation.black':presentationBlack.style.display=p.black?'block':'none';break;
  case'display.timer':applyTimer(p);break;case'display.timer.hide':applyTimer({...timerState,visible:false,running:false});break;
  case'display.clear':clearWebAudioTimers();activeWebFrame=null;activeWebSpec=null;text.textContent='';title.textContent='';subtitle.textContent='';media.innerHTML='';stage.style.background='#000';text.style.background='transparent';presentationBlack.style.display='none';identify.style.display='none';applyTimer({visible:false,running:false});requestAnimationFrame(fitAllContent);break;
  case'music.assistant.attach':attachMusicAssistant(p);break;case'music.assistant.detach':detachMusicAssistant();break;
  case'display.reload':location.reload();break;
}}
function connect(){ws=new WebSocket(wsUrl());ws.onopen=()=>{badge.textContent=`${id} ${preview?'preview':'connected'}`;ws.send(JSON.stringify({type:'hello',role:preview?'preview':'display',deviceId:id,token:preview?'':displayToken,clientVersion:DISPLAY_BUILD,meta:{url:location.href,...displayMetrics(),logicalResolution:`${LOGICAL_WIDTH}x${LOGICAL_HEIGHT}`,logicalScale:Number(stage.dataset.scale||1)}}))};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='hello.ack'){if(!preview&&m.version&&m.version!==DISPLAY_BUILD){badge.textContent=`${id} updating`;setTimeout(()=>location.reload(),250);return}applyState(m.state)}if(m.type==='error')badge.textContent=`${id} ${m.error||'error'}`;if(m.type==='command')handle(m.command);if(m.type==='heartbeat.ack'&&!preview)badge.textContent=`${id} connected`};ws.onclose=()=>{badge.textContent=`${id} disconnected`;setTimeout(connect,1500)}}
window.addEventListener('resize',scaleStage);
window.visualViewport?.addEventListener('resize',scaleStage);
document.addEventListener('fullscreenchange',scaleStage);
if(window.ResizeObserver)new ResizeObserver(()=>requestAnimationFrame(fitAllContent)).observe(stage);
scaleStage();
if(!preview)setInterval(sendDisplayMetrics,15000);
connect();
</script>
