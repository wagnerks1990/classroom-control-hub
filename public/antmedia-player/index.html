<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoomGoblin — Ant Media Player</title><link rel="stylesheet" href="/shared/attribution.css"><script src="/shared/attribution.js" defer></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#player{width:100%;height:100%;object-fit:cover;background:#000}#status{position:fixed;left:12px;bottom:12px;z-index:2;padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.58);color:#ddd;font:12px system-ui,sans-serif;display:none}</style><script src="/vendor/hls/hls.min.js"></script></head>
<body><video id="player" playsinline autoplay></video><div id="status"></div><script>
const video=document.getElementById('player'),status=document.getElementById('status');
const params=new URLSearchParams(location.search),source=params.get('source')||'',initialVolume=Math.max(0,Math.min(1,Number(params.get('volume')??1)));
let hls=null,candidateIndex=0,lastProgressAt=Date.now(),lastCurrentTime=0,recoveryCount=0,lastTelemetryAt=0;
const counters={manifestParsed:0,levelLoaded:0,fragmentLoaded:0,networkErrors:0,mediaErrors:0,otherErrors:0,stalls:0,recoveries:0};
function bufferedAhead(){try{for(let i=0;i<video.buffered.length;i++)if(video.buffered.start(i)<=video.currentTime&&video.buffered.end(i)>=video.currentTime)return Math.max(0,video.buffered.end(i)-video.currentTime)}catch{}return 0}
function telemetry(event,extra={},force=false){
  const now=Date.now();if(!force&&now-lastTelemetryAt<750&&event==='heartbeat')return;lastTelemetryAt=now;
  const payload={event,state:video.ended?'ended':video.paused?'paused':video.readyState<3?'buffering':'playing',at:new Date().toISOString(),url:hls?.url||video.currentSrc||'',source,candidateIndex,currentTime:Number(video.currentTime||0),bufferedAhead:Number(bufferedAhead().toFixed(3)),readyState:video.readyState,networkState:video.networkState,paused:video.paused,ended:video.ended,recoveryCount,counters:{...counters},...extra};
  try{parent.postMessage({type:'classroom-hub.antmedia.telemetry',telemetry:payload},location.origin)}catch{}
  try{console.info('[ClassroomHub AntMedia]',event,payload)}catch{}
}
function setStatus(text,show=false){status.textContent=text||'';status.style.display=show?'block':'none'}
function setAudio(volume=initialVolume){const v=Math.max(0,Math.min(1,Number(volume??initialVolume)));video.volume=v;video.muted=v<=0;video.defaultMuted=v<=0;if(v>0)video.removeAttribute('muted');else video.setAttribute('muted','');return v}
function hlsCandidates(){try{const u=new URL(source);const id=u.searchParams.get('id');if(!id)throw new Error('Missing stream id');const base=u.pathname.replace(/play\.html$/,'');const enc=encodeURIComponent(id);return [`${u.origin}${base}streams/${enc}.m3u8`,`${u.origin}${base}streams/${enc}_adaptive.m3u8`]}catch{return []}}
function play(){setAudio(video.volume);const p=video.play();if(p?.catch)p.catch(error=>telemetry('play-rejected',{error:String(error?.message||error)},true))}
function destroyHls(){if(hls){try{hls.destroy()}catch{}hls=null}}
function attach(url,index=0){
  candidateIndex=index;setStatus('Connecting…');destroyHls();video.removeAttribute('src');video.load();telemetry('attach',{url},true);
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:false,lowLatencyMode:true,backBufferLength:30,maxBufferLength:45,maxMaxBufferLength:90,manifestLoadingTimeOut:12000,levelLoadingTimeOut:12000,fragLoadingTimeOut:15000,manifestLoadingMaxRetry:4,levelLoadingMaxRetry:6,fragLoadingMaxRetry:8,fragLoadingRetryDelay:800,levelLoadingRetryDelay:800});
    hls.loadSource(url);hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{counters.manifestParsed++;setStatus('');lastProgressAt=Date.now();telemetry('manifest-parsed',{},true);play()});
    hls.on(Hls.Events.LEVEL_LOADED,()=>{counters.levelLoaded++;lastProgressAt=Date.now();telemetry('level-loaded')});
    hls.on(Hls.Events.FRAG_LOADED,()=>{counters.fragmentLoaded++;lastProgressAt=Date.now();if(counters.fragmentLoaded%10===0)telemetry('fragment-progress')});
    hls.on(Hls.Events.ERROR,(_event,data)=>{
      const type=String(data?.type||'unknown'),details=String(data?.details||'unknown'),fatal=!!data?.fatal,error=String(data?.error?.message||data?.reason||details);
      if(type===Hls.ErrorTypes.NETWORK_ERROR)counters.networkErrors++;else if(type===Hls.ErrorTypes.MEDIA_ERROR)counters.mediaErrors++;else counters.otherErrors++;
      telemetry(fatal?'hls-fatal-error':'hls-error',{type,details,fatal,error,responseCode:data?.response?.code??null},true);
      if(!fatal)return;
      if(type===Hls.ErrorTypes.NETWORK_ERROR){
        counters.recoveries++;recoveryCount++;setStatus('Stream reconnecting…');
        try{hls.startLoad()}catch{}
        return;
      }
      if(type===Hls.ErrorTypes.MEDIA_ERROR){
        counters.recoveries++;recoveryCount++;setStatus('Recovering stream…');
        try{hls.recoverMediaError()}catch{}
        return;
      }
      const candidates=hlsCandidates();
      if(candidateIndex+1<candidates.length){counters.recoveries++;recoveryCount++;setTimeout(()=>attach(candidates[candidateIndex+1],candidateIndex+1),750);return}
      setStatus('Morning Announcements HLS unavailable — retrying.',true);
      setTimeout(()=>{const list=hlsCandidates();if(list.length){counters.recoveries++;recoveryCount++;attach(list[0],0)}},3000);
    });
  }else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=url;video.addEventListener('loadedmetadata',()=>{setStatus('');lastProgressAt=Date.now();telemetry('native-hls-loaded',{},true);play()},{once:true});
    video.addEventListener('error',()=>{telemetry('native-hls-error',{error:'Native HLS media error'},true);const c=hlsCandidates();if(index+1<c.length)setTimeout(()=>attach(c[index+1],index+1),750);else setTimeout(()=>c.length&&attach(c[0],0),3000)},{once:true});
  }else setStatus('This display browser cannot play HLS.',true)
}
for(const event of ['playing','waiting','stalled','pause','ended','error','loadedmetadata','canplay'])video.addEventListener(event,()=>{
  if(event==='waiting'||event==='stalled')counters.stalls++;
  if(event==='playing'){lastProgressAt=Date.now();setStatus('')}
  telemetry(`media-${event}`,event==='error'?{error:`HTMLMediaElement error ${video.error?.code||'unknown'}`}:{},true);
});
setInterval(()=>{
  const now=Date.now(),current=Number(video.currentTime||0);
  if(current>lastCurrentTime+.05){lastCurrentTime=current;lastProgressAt=now}
  const stagnantMs=now-lastProgressAt;
  telemetry('heartbeat',{stagnantMs});
  if(hls&&!video.paused&&!video.ended&&video.readyState<3&&stagnantMs>12000){
    counters.recoveries++;recoveryCount++;lastProgressAt=now;telemetry('watchdog-recover',{stagnantMs},true);
    try{hls.startLoad()}catch{}
  }
},5000);
window.addEventListener('online',()=>telemetry('browser-online',{},true));
window.addEventListener('offline',()=>telemetry('browser-offline',{},true));
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.type==='setVolume'||d.action==='setVolume'){setAudio(d.volume);telemetry('volume-change',{volume:video.volume},true)}if(d.type==='setMuted')setAudio(d.muted?0:(video.volume||initialVolume||1));if(d.type==='unmute'||d.action==='unmute'){if(video.volume<=0)setAudio(initialVolume||1);else{video.muted=false;video.defaultMuted=false}play()}if(d.type==='play')play()});
setAudio();const candidates=hlsCandidates();if(candidates.length)attach(candidates[0],0);else{setStatus('Invalid Morning Announcements stream URL.',true);telemetry('invalid-source',{error:'Unable to derive HLS playlist candidates'},true)}
</script></body></html>
