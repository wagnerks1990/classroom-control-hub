<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classroom Control Hub — Ant Media Player</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#player{width:100%;height:100%;object-fit:cover;background:#000}#status{position:fixed;left:12px;bottom:12px;z-index:2;padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.58);color:#ddd;font:12px system-ui,sans-serif;display:none}</style><script src="/vendor/hls/hls.min.js"></script></head>
<body><video id="player" playsinline autoplay></video><div id="status"></div><script>
const video=document.getElementById('player'),status=document.getElementById('status');
const params=new URLSearchParams(location.search),source=params.get('source')||'',initialVolume=Math.max(0,Math.min(1,Number(params.get('volume')??1)));
let hls=null,attempt=0;
function setStatus(text,show=false){status.textContent=text||'';status.style.display=show?'block':'none'}
function setAudio(volume=initialVolume){const v=Math.max(0,Math.min(1,Number(volume??initialVolume)));video.volume=v;video.muted=v<=0;video.defaultMuted=v<=0;if(v>0)video.removeAttribute('muted');else video.setAttribute('muted','');return v}
function hlsCandidates(){try{const u=new URL(source);const id=u.searchParams.get('id');if(!id)throw new Error('Missing stream id');const base=u.pathname.replace(/play\.html$/,'');const enc=encodeURIComponent(id);return [`${u.origin}${base}streams/${enc}.m3u8`,`${u.origin}${base}streams/${enc}_adaptive.m3u8`]}catch{return []}}
function play(){setAudio(video.volume);const p=video.play();if(p?.catch)p.catch(()=>{})}
function attach(url){attempt++;setStatus('Connecting…');if(hls){try{hls.destroy()}catch{}hls=null}video.removeAttribute('src');video.load();if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:true,backBufferLength:30});hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>{setStatus('');play()});hls.on(Hls.Events.ERROR,(_e,data)=>{if(!data?.fatal)return;const c=hlsCandidates();if(attempt<c.length){attach(c[attempt]);return}setStatus('HerdTV HLS unavailable — use Reload + Unmute to retry.',true)})}else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.addEventListener('loadedmetadata',()=>{setStatus('');play()},{once:true});video.addEventListener('error',()=>{const c=hlsCandidates();if(attempt<c.length)attach(c[attempt]);else setStatus('HerdTV HLS unavailable — use Reload + Unmute to retry.',true)},{once:true})}else setStatus('This display browser cannot play HLS.',true)}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='setVolume'||d.action==='setVolume')setAudio(d.volume);if(d.type==='setMuted')setAudio(d.muted?0:(video.volume||initialVolume||1));if(d.type==='unmute'||d.action==='unmute'){if(video.volume<=0)setAudio(initialVolume||1);else{video.muted=false;video.defaultMuted=false}play()}if(d.type==='play')play()});
setAudio();const candidates=hlsCandidates();if(candidates.length)attach(candidates[0]);else setStatus('Invalid HerdTV stream URL.',true);
</script></body></html>
