<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}.shell{display:grid}.workspace{display:none}.workspace.active{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr}.nav{display:flex;gap:8px;flex-wrap:wrap}.targets{display:grid}.previewViewport{aspect-ratio:16/9;background:#000}h2{margin-top:0}.toolbar{display:flex;gap:8px}</style><script src="/shared/workspace.js" defer></script></head><body><div class="wrap"><div class="top"><h1>Display controls</h1></div><div class="shell"><aside class="left"><div class="panel"><h2>Targets</h2><div id="targets" class="targets"><label><input type="checkbox" checked> Front screen</label></div><div id="targetSelectionSummary">Selected: Front screen</div></div><div class="panel"><h2>Classroom session</h2><button>Clear classroom</button></div></aside><main class="main"><div class="panel previewPanel"><h2>Live preview</h2><div class="previewViewport"><iframe id="previewFrame" title="Preview"></iframe></div></div><div class="panel"><div class="nav"><button data-work="display" class="active" onclick="showWorkspace('display')">display</button><button data-work="timer" class="" onclick="showWorkspace('timer')">timer</button><button data-work="media" class="" onclick="showWorkspace('media')">media</button><button data-work="lighting" class="" onclick="showWorkspace('lighting')">lighting</button><button data-work="av" class="" onclick="showWorkspace('av')">av</button><button data-work="scenes" class="" onclick="showWorkspace('scenes')">scenes</button><button data-work="settings" class="" onclick="showWorkspace('settings')">settings</button><button data-work="diagnostics" class="" onclick="showWorkspace('diagnostics')">diagnostics</button></div><section id="display" class="workspace active"><h2>Display layers</h2><div class="grid2"><div><label for="titleText">Title</label><input id="titleText"></div><div><label for="subtitleText">Subtitle</label><input id="subtitleText"></div><div><label for="titleColor">titleColor</label><input id="titleColor" type="color"></div><div><label for="subtitleColor">subtitleColor</label><input id="subtitleColor" type="color"></div><div><label for="titleSize">titleSize</label><input id="titleSize" type="number"></div><div><label for="subtitleSize">subtitleSize</label><input id="subtitleSize" type="number"></div></div><button id="sendTitle" onclick="window.hardwareActions.push('send')">Send title</button></section><section id="timer" class="workspace"><h2>Timer</h2><button>Open timer controls</button></section><section id="media" class="workspace"><h2>Media</h2><button>Open media controls</button></section><section id="lighting" class="workspace"><h2>Lighting</h2><button>Open lighting controls</button></section><section id="av" class="workspace"><h2>Av</h2><button>Open av controls</button></section><section id="scenes" class="workspace"><h2>Scenes</h2><button>Open scenes controls</button></section><section id="settings" class="workspace"><h2>Settings</h2><button>Open settings controls</button></section><section id="diagnostics" class="workspace"><h2>Diagnostics</h2><button>Open diagnostics controls</button></section></div></main></div></div><footer class="app-attribution" data-kyle-attribution>Built by Kyle Wagner</footer><script>window.hardwareActions=[];function showWorkspace(id){document.querySelectorAll('.workspace').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-work]').forEach(x=>x.classList.toggle('active',x.dataset.work===id))}</script></body></html>
